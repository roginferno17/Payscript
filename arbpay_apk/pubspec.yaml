name: arbpay_bot
description: ARBPay automated buy bot with beautiful UI
publish_to: 'none'
version: 1.2.2+4

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_inappwebview: ^6.0.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  cupertino_icons: ^1.0.6
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3
  widgetbook: ^3.4.0

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/ic_launcher.png"
  adaptive_icon_background: "#F5A623"
  adaptive_icon_foreground: "assets/icon/ic_launcher_foreground.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/app_icon_dark.png
    - assets/images/app_icon_light.png
